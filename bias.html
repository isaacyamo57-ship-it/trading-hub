<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NQ Bias Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Fragment+Mono:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #07070a;
  --bg2:     #0d0d10;
  --bg3:     #131316;
  --bg4:     #1a1a1e;
  --bg5:     #222228;
  --border:  rgba(255,255,255,0.06);
  --border2: rgba(255,255,255,0.11);
  --border3: rgba(255,255,255,0.18);
  --text:    #f2eeea;
  --text2:   #b0aca6;
  --text3:   #706c67;
  --gold:    #c9a84c;
  --gold2:   #e8c870;
  --golddim: rgba(201,168,76,0.12);
  --win:     #56b882;
  --win2:    rgba(86,184,130,0.12);
  --loss:    #c96464;
  --loss2:   rgba(201,100,100,0.12);
  --neut:    #6a9fd4;
  --neut2:   rgba(106,159,212,0.1);
  --r: 12px;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html { scroll-behavior:smooth; }

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Grid BG */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(201,168,76,0.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(201,168,76,0.018) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
  z-index: 0;
}

/* Glow vignette */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(201,168,76,0.04) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.wrap {
  max-width: 960px;
  margin: 0 auto;
  padding: 48px 24px 96px;
  position: relative;
  z-index: 1;
}

/* ── HEADER ── */
.header {
  text-align: center;
  margin-bottom: 40px;
  animation: fadeDown 0.7s cubic-bezier(0.16,1,0.3,1) both;
}

.header-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: 'Fragment Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 14px;
}
.header-eyebrow::before,
.header-eyebrow::after {
  content: '';
  width: 32px;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--gold));
  opacity: 0.4;
}
.header-eyebrow::after { transform: scaleX(-1); }

.header h1 {
  font-family: 'Syne', sans-serif;
  font-size: clamp(34px, 6vw, 54px);
  font-weight: 800;
  letter-spacing: -0.035em;
  line-height: 1;
  background: linear-gradient(140deg, #f2eeea 0%, #c9a84c 50%, #7a5e26 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 10px;
}

.header-sub {
  font-family: 'Fragment Mono', monospace;
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 0.07em;
  margin-bottom: 12px;
}

.pill-group {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: 'Fragment Mono', monospace;
  font-size: 8px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid;
}
.pill-live {
  background: rgba(86,184,130,0.08);
  border-color: rgba(86,184,130,0.22);
  color: var(--win);
}
.pill-live .dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--win);
  animation: livePulse 1.6s ease infinite;
}
.pill-ict {
  background: var(--golddim);
  border-color: rgba(201,168,76,0.2);
  color: var(--gold);
}

/* ── TOPBAR ── */
.topbar {
  display: flex;
  align-items: center;
  gap: 0;
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: var(--r);
  margin-bottom: 20px;
  overflow: hidden;
  animation: fadeUp 0.5s 0.1s cubic-bezier(0.16,1,0.3,1) both;
}
.tb-seg {
  flex: 1;
  padding: 13px 18px;
  border-right: 1px solid var(--border);
  min-width: 0;
}
.tb-seg:last-child { border-right: none; }
.tb-lbl {
  font-family: 'Fragment Mono', monospace;
  font-size: 8px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 3px;
}
.tb-val {
  font-family: 'Fragment Mono', monospace;
  font-size: 11px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tb-val.green { color: var(--win); }
.tb-time { flex: 0 0 auto; }
#clock { font-variant-numeric: tabular-nums; }

/* ── ANALYSE BUTTON ── */
.btn-wrap {
  margin-bottom: 28px;
  animation: fadeUp 0.5s 0.18s cubic-bezier(0.16,1,0.3,1) both;
}
.analyse-btn {
  width: 100%;
  padding: 19px 24px;
  background: linear-gradient(135deg, #c9a84c 0%, #9c7c30 100%);
  border: none;
  border-radius: var(--r);
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: #060500;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform 0.18s cubic-bezier(0.16,1,0.3,1), box-shadow 0.18s ease, opacity 0.15s;
}
.analyse-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 55%);
  pointer-events: none;
}
.analyse-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 40%);
  opacity: 0;
  transition: opacity 0.18s;
  pointer-events: none;
}
.analyse-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 36px rgba(201,168,76,0.28); }
.analyse-btn:hover::after { opacity: 1; }
.analyse-btn:active { transform: translateY(0); }
.analyse-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-inner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  position: relative;
}
.btn-icon { font-size: 16px; }

/* ── LOADING ── */
.loading {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 56px 24px;
}
.loading.show { display: flex; animation: fadeIn 0.25s ease both; }

.spinner-wrap {
  position: relative;
  width: 64px;
  height: 64px;
}
.spinner-track {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid rgba(201,168,76,0.1);
}
.spinner-arc {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid transparent;
  border-top-color: var(--gold);
  border-right-color: rgba(201,168,76,0.4);
  animation: spin 0.85s linear infinite;
}
.spinner-dot {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--gold);
  opacity: 0.7;
  animation: dotPulse 0.85s ease infinite;
}

.loading-label {
  font-family: 'Fragment Mono', monospace;
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.loading-step-text {
  font-family: 'Fragment Mono', monospace;
  font-size: 11px;
  color: var(--gold);
  letter-spacing: 0.06em;
  min-height: 16px;
  animation: stepFade 0.35s ease;
}
.loading-progress {
  width: 180px;
  height: 2px;
  background: var(--bg4);
  border-radius: 2px;
  overflow: hidden;
}
.loading-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--gold), var(--gold2));
  border-radius: 2px;
  width: 0%;
  transition: width 1.8s ease;
}

/* ── RESULTS ── */
.results { display: none; }
.results.show { display: block; animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) both; }

/* Results top bar */
.results-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 8px;
}
.results-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.results-date {
  font-family: 'Fragment Mono', monospace;
  font-size: 9px;
  color: var(--text3);
  letter-spacing: 0.06em;
}
.results-count {
  font-family: 'Fragment Mono', monospace;
  font-size: 9px;
  color: var(--win);
  letter-spacing: 0.04em;
}
.refresh-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  color: var(--text3);
  font-family: 'Fragment Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.08em;
  padding: 7px 14px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s;
}
.refresh-btn:hover { color: var(--text); border-color: var(--border3); background: var(--bg4); }

/* ── VERDICT CARD ── */
.verdict-card {
  border-radius: 16px;
  padding: 28px;
  margin-bottom: 16px;
  border: 1px solid;
  position: relative;
  overflow: hidden;
}
.verdict-card::before {
  content: '';
  position: absolute;
  top: -60px;
  right: -60px;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  opacity: 0.07;
  filter: blur(40px);
  pointer-events: none;
}
.verdict-card.bull { background: linear-gradient(145deg, rgba(86,184,130,0.1) 0%, rgba(86,184,130,0.02) 100%); border-color: rgba(86,184,130,0.2); }
.verdict-card.bull::before { background: var(--win); }
.verdict-card.bear { background: linear-gradient(145deg, rgba(201,100,100,0.1) 0%, rgba(201,100,100,0.02) 100%); border-color: rgba(201,100,100,0.2); }
.verdict-card.bear::before { background: var(--loss); }
.verdict-card.neut { background: linear-gradient(145deg, rgba(106,159,212,0.08) 0%, rgba(106,159,212,0.02) 100%); border-color: rgba(106,159,212,0.18); }
.verdict-card.neut::before { background: var(--neut); }

.verdict-main {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.verdict-left {}
.verdict-eyebrow {
  font-family: 'Fragment Mono', monospace;
  font-size: 8px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 8px;
}
.verdict-bias {
  font-family: 'Syne', sans-serif;
  font-size: clamp(36px, 5vw, 52px);
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1;
  margin-bottom: 4px;
}
.verdict-bias.bull { color: var(--win); }
.verdict-bias.bear { color: var(--loss); }
.verdict-bias.neut { color: var(--neut); }
.verdict-symbol {
  font-size: 0.65em;
  vertical-align: middle;
  margin-right: 4px;
  opacity: 0.8;
}

.verdict-right { text-align: right; }
.conf-ring-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 80px;
  height: 80px;
}
.conf-ring-wrap svg {
  position: absolute;
  inset: 0;
  transform: rotate(-90deg);
}
.conf-track { fill: none; stroke: var(--bg4); stroke-width: 4; }
.conf-arc {
  fill: none;
  stroke: var(--gold);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-dasharray: 220;
  stroke-dashoffset: 220;
  transition: stroke-dashoffset 1.4s cubic-bezier(0.16,1,0.3,1);
}
.conf-inner { position: relative; text-align: center; }
.conf-pct {
  font-family: 'Syne', sans-serif;
  font-size: 20px;
  font-weight: 800;
  color: var(--gold);
  line-height: 1;
  display: block;
  font-variant-numeric: tabular-nums;
}
.conf-lbl {
  font-family: 'Fragment Mono', monospace;
  font-size: 7px;
  color: var(--text3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-top: 2px;
  display: block;
}

.verdict-summary {
  font-size: 13px;
  color: var(--text2);
  line-height: 1.7;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  margin-bottom: 10px;
}

.verdict-footer {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: 'Fragment Mono', monospace;
  font-size: 8px;
  letter-spacing: 0.08em;
  padding: 3px 9px;
  border-radius: 20px;
  border: 1px solid;
}
.badge-live { background: rgba(86,184,130,0.07); border-color: rgba(86,184,130,0.18); color: var(--win); }
.badge-ai { background: var(--golddim); border-color: rgba(201,168,76,0.2); color: var(--gold); }

/* ── SECTION TITLE ── */
.sec-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  margin-top: 4px;
}
.sec-head-label {
  font-family: 'Fragment Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text3);
  white-space: nowrap;
}
.sec-head-line {
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ── TIMEFRAME GRID ── */
.tf-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}
.tf-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 18px 16px;
  transition: border-color 0.2s;
}
.tf-card:hover { border-color: var(--border2); }
.tf-label {
  font-family: 'Fragment Mono', monospace;
  font-size: 8px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 10px;
}
.tf-bias-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-bottom: 6px;
}
.tf-sym { font-size: 11px; }
.tf-sym.bull { color: var(--win); }
.tf-sym.bear { color: var(--loss); }
.tf-sym.neut { color: var(--neut); }
.tf-name {
  font-family: 'Syne', sans-serif;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.tf-name.bull { color: var(--win); }
.tf-name.bear { color: var(--loss); }
.tf-name.neut { color: var(--neut); }
.tf-reason {
  font-size: 11px;
  color: var(--text2);
  line-height: 1.55;
  margin-bottom: 10px;
}
.tf-bar-track {
  height: 3px;
  background: var(--bg5);
  border-radius: 3px;
  overflow: hidden;
}
.tf-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 1.3s cubic-bezier(0.16,1,0.3,1);
}
.tf-bar-fill.bull { background: linear-gradient(90deg, var(--win), rgba(86,184,130,0.5)); }
.tf-bar-fill.bear { background: linear-gradient(90deg, var(--loss), rgba(201,100,100,0.5)); }
.tf-bar-fill.neut { background: linear-gradient(90deg, var(--neut), rgba(106,159,212,0.5)); }
.tf-strength {
  font-family: 'Fragment Mono', monospace;
  font-size: 9px;
  color: var(--text3);
  margin-top: 5px;
  text-align: right;
}

/* ── NEWS DRIVERS ── */
.news-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 16px;
}
.news-item {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  display: grid;
  grid-template-columns: 36px 1fr auto;
  gap: 12px;
  align-items: start;
  transition: border-color 0.2s;
}
.news-item:hover { border-color: var(--border2); }
.news-icon-box {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.news-icon-box.bull { background: var(--win2); }
.news-icon-box.bear { background: var(--loss2); }
.news-icon-box.neut { background: var(--neut2); }
.news-body {}
.news-source {
  font-family: 'Fragment Mono', monospace;
  font-size: 8px;
  color: var(--text3);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 3px;
}
.news-headline {
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text);
  line-height: 1.45;
  margin-bottom: 4px;
}
.news-reason {
  font-size: 11px;
  color: var(--text3);
  line-height: 1.5;
}
.news-tag {
  flex-shrink: 0;
  font-family: 'Fragment Mono', monospace;
  font-size: 7.5px;
  letter-spacing: 0.07em;
  padding: 3px 8px;
  border-radius: 5px;
  border: 1px solid;
  white-space: nowrap;
  align-self: flex-start;
  margin-top: 1px;
}
.news-tag.bull { background: var(--win2); border-color: rgba(86,184,130,0.2); color: var(--win); }
.news-tag.bear { background: var(--loss2); border-color: rgba(201,100,100,0.2); color: var(--loss); }
.news-tag.neut { background: var(--neut2); border-color: rgba(106,159,212,0.18); color: var(--neut); }

/* ── BOTTOM GRID ── */
.bottom-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}
.info-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 16px 18px;
}
.info-card-head {
  font-family: 'Fragment Mono', monospace;
  font-size: 8px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  gap: 8px;
}
.info-row:last-child { border-bottom: none; }
.info-key {
  font-size: 12px;
  color: var(--text2);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.info-val {
  font-family: 'Fragment Mono', monospace;
  font-size: 11px;
  white-space: nowrap;
  flex-shrink: 0;
}
.info-val.bull { color: var(--win); }
.info-val.bear { color: var(--loss); }
.info-val.neut { color: var(--neut); }
.info-val.muted { color: var(--text3); }

/* ── TRADE PLAN ── */
.plan-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 16px 18px;
  margin-bottom: 16px;
}
.plan-row {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 7px 0;
  border-bottom: 1px solid var(--border);
}
.plan-row:last-child { border-bottom: none; }
.plan-indicator {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
  margin-top: 3px;
}
.plan-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.plan-dot.bull { background: var(--win); box-shadow: 0 0 6px rgba(86,184,130,0.5); }
.plan-dot.bear { background: var(--loss); box-shadow: 0 0 6px rgba(201,100,100,0.5); }
.plan-dot.warn { background: var(--gold); box-shadow: 0 0 6px rgba(201,168,76,0.5); }
.plan-text {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.6;
}

/* ── DISCLAIMER ── */
.disclaimer {
  background: rgba(201,168,76,0.03);
  border: 1px solid rgba(201,168,76,0.1);
  border-radius: 8px;
  padding: 12px 18px;
  font-family: 'Fragment Mono', monospace;
  font-size: 9px;
  color: var(--text3);
  letter-spacing: 0.04em;
  line-height: 1.7;
  text-align: center;
}

/* ── ERROR ── */
.error-card {
  background: rgba(201,100,100,0.07);
  border: 1px solid rgba(201,100,100,0.18);
  border-radius: var(--r);
  padding: 24px;
  text-align: center;
  font-family: 'Fragment Mono', monospace;
  font-size: 11px;
  color: var(--loss);
  line-height: 1.7;
}

/* ── SKELETON ── */
.skel {
  background: linear-gradient(90deg, var(--bg3) 25%, var(--bg4) 50%, var(--bg3) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: 4px;
}

/* ── KEYFRAMES ── */
@keyframes fadeDown {
  from { opacity:0; transform:translateY(-18px); }
  to   { opacity:1; transform:none; }
}
@keyframes fadeUp {
  from { opacity:0; transform:translateY(18px); }
  to   { opacity:1; transform:none; }
}
@keyframes fadeIn {
  from { opacity:0; }
  to   { opacity:1; }
}
@keyframes spin {
  to { transform:rotate(360deg); }
}
@keyframes dotPulse {
  0%,100% { transform:translate(-50%,-50%) scale(1); opacity:0.7; }
  50%      { transform:translate(-50%,-50%) scale(1.4); opacity:1; }
}
@keyframes stepFade {
  from { opacity:0; transform:translateY(4px); }
  to   { opacity:1; transform:none; }
}
@keyframes livePulse {
  0%,100% { box-shadow:0 0 0 0 rgba(86,184,130,0.4); }
  50%     { box-shadow:0 0 0 4px rgba(86,184,130,0); }
}
@keyframes shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  .wrap { padding: 32px 16px 72px; }
  .topbar { flex-wrap: wrap; }
  .tb-seg { flex: 1 1 40%; }
  .tf-grid { grid-template-columns: 1fr; }
  .bottom-grid { grid-template-columns: 1fr; }
  .verdict-main { flex-direction: column; gap: 16px; }
  .verdict-right { text-align: left; }
}
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <div class="header">
    <div class="header-eyebrow">NQ Futures · ICT Framework</div>
    <h1>Bias Engine</h1>
    <div class="header-sub">Live financial news · AI reasoning · ICT structure analysis</div>
    <div class="pill-group">
      <div class="pill pill-live"><div class="dot"></div>Live News Feed</div>
      <div class="pill pill-ict">ICT · FVG · MSS · CISD</div>
    </div>
  </div>

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="tb-seg">
      <div class="tb-lbl">Instrument</div>
      <div class="tb-val">NQ / Nasdaq 100</div>
    </div>
    <div class="tb-seg">
      <div class="tb-lbl">Session</div>
      <div class="tb-val" id="sessionLabel">—</div>
    </div>
    <div class="tb-seg">
      <div class="tb-lbl">News Source</div>
      <div class="tb-val green">NewsAPI · Live</div>
    </div>
    <div class="tb-seg tb-time">
      <div class="tb-lbl">UTC Time</div>
      <div class="tb-val" id="clock">—</div>
    </div>
  </div>

  <!-- BUTTON -->
  <div class="btn-wrap">
    <button class="analyse-btn" id="analyseBtn" onclick="runAnalysis()" aria-label="Analyse NQ bias with live news">
      <div class="btn-inner">
        <span class="btn-icon">⚡</span>
        <span>Analyse NQ Bias — Live News</span>
      </div>
    </button>
  </div>

  <!-- LOADING -->
  <div class="loading" id="loading" role="status" aria-live="polite">
    <div class="spinner-wrap">
      <div class="spinner-track"></div>
      <div class="spinner-arc"></div>
      <div class="spinner-dot"></div>
    </div>
    <div class="loading-label">Analysing market conditions</div>
    <div class="loading-step-text" id="loadingStep">Connecting...</div>
    <div class="loading-progress">
      <div class="loading-bar" id="loadingBar"></div>
    </div>
  </div>

  <!-- RESULTS -->
  <div class="results" id="results" role="main"></div>

</div>

<script>
// ── CLOCK + SESSION ──
(function clock() {
  function tick() {
    const n = new Date();
    const h = n.getUTCHours(), m = n.getUTCMinutes();
    const hm = h * 100 + m;
    document.getElementById('clock').textContent =
      n.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', second:'2-digit', timeZone:'UTC' });
    const sess =
      hm >= 200  && hm < 430  ? 'Asia' :
      hm >= 700  && hm < 1130 ? 'London AM' :
      hm >= 1130 && hm < 1200 ? 'London / NY Overlap' :
      hm >= 1200 && hm < 1700 ? 'NY AM' :
      hm >= 1700 && hm < 2100 ? 'NY PM' : 'Off Hours';
    const el = document.getElementById('sessionLabel');
    el.textContent = sess;
    el.style.color = hm >= 1200 && hm < 2100 ? 'var(--win)' : hm >= 700 && hm < 1200 ? 'var(--gold)' : 'var(--text)';
  }
  tick(); setInterval(tick, 1000);
})();

// ── LOADING STEPS ──
const STEPS = [
  'Fetching live news headlines...',
  'Analysing macro environment...',
  'Processing 4H structure...',
  'Processing 1H & 15M...',
  'Building bias report...'
];
let _si = 0, _st = null;

function startSteps() {
  _si = 0;
  const el = document.getElementById('loadingStep');
  const bar = document.getElementById('loadingBar');
  el.textContent = STEPS[0];
  bar.style.width = '10%';
  _st = setInterval(() => {
    _si = Math.min(_si + 1, STEPS.length - 1);
    el.style.animation = 'none';
    requestAnimationFrame(() => {
      el.style.animation = '';
      el.textContent = STEPS[_si];
    });
    bar.style.width = ((_si + 1) / STEPS.length * 90) + '%';
  }, 1800);
}
function stopSteps() {
  if (_st) clearInterval(_st);
  document.getElementById('loadingBar').style.width = '100%';
}

// ── HELPERS ──
function bc(b) {
  const l = (b || '').toLowerCase();
  return l === 'bullish' ? 'bull' : l === 'bearish' ? 'bear' : 'neut';
}
function sym(b) {
  const l = (b || '').toLowerCase();
  return l === 'bullish' ? '▲' : l === 'bearish' ? '▼' : '◆';
}
function colVal(b) {
  const c = bc(b);
  return c === 'bull' ? 'var(--win)' : c === 'bear' ? 'var(--loss)' : 'var(--neut)';
}

// ── MAIN ANALYSIS ──
async function runAnalysis() {
  const btn     = document.getElementById('analyseBtn');
  const loading = document.getElementById('loading');
  const results = document.getElementById('results');

  btn.disabled = true;
  loading.classList.add('show');
  results.classList.remove('show');
  results.innerHTML = '';
  startSteps();

  try {
    const res  = await fetch('/.netlify/functions/analyse', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: '{}'
    });
    const json = await res.json();
    stopSteps();
    if (json.error) renderError(json.error);
    else renderResults(json.analysis, json.articleCount);
  } catch(e) {
    stopSteps();
    renderError('Could not reach the analysis server. Make sure this is deployed on Netlify with valid API keys.');
  }

  loading.classList.remove('show');
  btn.disabled = false;
}

// ── RENDER ERROR ──
function renderError(msg) {
  const r = document.getElementById('results');
  r.innerHTML = `<div class="error-card">⚠ ${msg}</div>`;
  r.classList.add('show');
}

// ── RENDER RESULTS ──
function renderResults(a, articleCount) {
  const now     = new Date();
  const dateStr = now.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
  const timeStr = now.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
  const overall = bc(a.overall_bias);
  const tfs     = a.timeframes   || {};
  const sb      = a.session_bias || {};
  const mf      = a.macro_factors|| {};

  // Confidence ring math: circumference ~220 for r=35
  const circumf   = 2 * Math.PI * 35;
  const confPct   = Math.min(100, Math.max(0, a.confidence || 0));
  const dashOffset = circumf * (1 - confPct / 100);

  // Timeframe cards
  const tfHTML = ['4H','1H','15M'].map(tf => {
    const t  = tfs[tf] || { bias:'Neutral', strength:50, reason:'No data' };
    const tc = bc(t.bias);
    const st = t.strength || 50;
    return `
      <div class="tf-card">
        <div class="tf-label">${tf} Timeframe</div>
        <div class="tf-bias-row">
          <span class="tf-sym ${tc}">${sym(t.bias)}</span>
          <span class="tf-name ${tc}">${t.bias}</span>
        </div>
        <div class="tf-reason">${t.reason}</div>
        <div class="tf-bar-track">
          <div class="tf-bar-fill ${tc}" style="width:${st}%"></div>
        </div>
        <div class="tf-strength">${st}% strength</div>
      </div>`;
  }).join('');

  // News drivers
  const newsHTML = (a.news_drivers || []).slice(0,6).map(n => {
    const nc = bc(n.impact);
    return `
      <div class="news-item">
        <div class="news-icon-box ${nc}">${n.emoji || '📰'}</div>
        <div class="news-body">
          <div class="news-source">${n.source || ''}</div>
          <div class="news-headline">${n.headline}</div>
          <div class="news-reason">${n.reason}</div>
        </div>
        <div class="news-tag ${nc}">${n.impact}</div>
      </div>`;
  }).join('');

  // Key levels
  const levelsAbove = (a.key_levels?.watch_above || [])
    .map(l => `<div class="info-row"><span class="info-key">${l}</span><span class="info-val bull">▲</span></div>`)
    .join('') || `<div class="info-row"><span class="info-key" style="color:var(--text3)">Check chart</span></div>`;
  const levelsBelow = (a.key_levels?.watch_below || [])
    .map(l => `<div class="info-row"><span class="info-key">${l}</span><span class="info-val bear">▼</span></div>`)
    .join('') || `<div class="info-row"><span class="info-key" style="color:var(--text3)">Check chart</span></div>`;

  // Session bias
  const sessHTML = [['london','London AM'],['nyam','NY AM'],['nypm','NY PM']].map(([k,label]) => {
    const bias = sb[k] || 'Neutral';
    const sc   = bc(bias);
    return `<div class="info-row"><span class="info-key">${label}</span><span class="info-val ${sc}">${sym(bias)} ${bias}</span></div>`;
  }).join('');

  // Macro
  const macroMap = [
    ['Fed Stance',     mf.fed_stance,      mf.fed_stance === 'Dovish'   ? 'bull' : mf.fed_stance === 'Hawkish' ? 'bear' : 'neut'],
    ['Risk Sentiment', mf.risk_sentiment,  mf.risk_sentiment === 'Risk-On' ? 'bull' : mf.risk_sentiment === 'Risk-Off' ? 'bear' : 'neut'],
    ['VIX Tone',       mf.vix_tone,        mf.vix_tone === 'Low'   ? 'bull' : mf.vix_tone === 'High' ? 'bear' : 'neut'],
    ['Dollar',         mf.dollar_tone,     mf.dollar_tone === 'Weak' ? 'bull' : mf.dollar_tone === 'Strong' ? 'bear' : 'neut'],
  ];
  const macroHTML = macroMap.map(([k,v,c]) =>
    `<div class="info-row"><span class="info-key">${k}</span><span class="info-val ${c || 'muted'}">${v || '—'}</span></div>`
  ).join('');

  // Trade plan
  const planHTML = (a.trade_plan || []).map(p =>
    `<div class="plan-row">
      <div class="plan-indicator"><div class="plan-dot ${p.type}"></div></div>
      <div class="plan-text">${p.text}</div>
    </div>`
  ).join('');

  // Build HTML
  const html = `
    <div class="results-topbar">
      <div class="results-meta">
        <div class="results-date">${dateStr} · ${timeStr}</div>
        <div class="results-count">✓ ${articleCount} live articles analysed</div>
      </div>
      <button class="refresh-btn" onclick="runAnalysis()" aria-label="Re-analyse NQ bias">
        <span>↻</span><span>Re-analyse</span>
      </button>
    </div>

    <!-- VERDICT -->
    <div class="verdict-card ${overall}">
      <div class="verdict-main">
        <div class="verdict-left">
          <div class="verdict-eyebrow">Overall NQ Bias</div>
          <div class="verdict-bias ${overall}">
            <span class="verdict-symbol">${sym(a.overall_bias)}</span>${a.overall_bias}
          </div>
        </div>
        <div class="verdict-right">
          <div class="conf-ring-wrap" aria-label="Confidence ${confPct}%">
            <svg viewBox="0 0 80 80" width="80" height="80">
              <circle class="conf-track" cx="40" cy="40" r="35"/>
              <circle class="conf-arc" id="confArc" cx="40" cy="40" r="35"
                stroke-dasharray="${circumf.toFixed(1)}"
                stroke-dashoffset="${circumf.toFixed(1)}"/>
            </svg>
            <div class="conf-inner">
              <span class="conf-pct">${confPct}%</span>
              <span class="conf-lbl">conf.</span>
            </div>
          </div>
        </div>
      </div>
      <div class="verdict-summary">${a.summary}</div>
      <div class="verdict-footer">
        <div class="badge badge-live">⚡ ${articleCount} articles</div>
        <div class="badge badge-ai">Claude AI</div>
      </div>
    </div>

    <!-- TIMEFRAMES -->
    <div class="sec-head"><span class="sec-head-label">HTF Bias Breakdown</span><div class="sec-head-line"></div></div>
    <div class="tf-grid">${tfHTML}</div>

    <!-- NEWS -->
    <div class="sec-head"><span class="sec-head-label">Live News Drivers</span><div class="sec-head-line"></div></div>
    <div class="news-list">${newsHTML}</div>

    <!-- LEVELS + SESSIONS + MACRO -->
    <div class="bottom-grid">
      <div class="info-card">
        <div class="info-card-head">Watch Above</div>
        ${levelsAbove}
      </div>
      <div class="info-card">
        <div class="info-card-head">Watch Below</div>
        ${levelsBelow}
      </div>
      <div class="info-card">
        <div class="info-card-head">Session Bias</div>
        ${sessHTML}
      </div>
      <div class="info-card">
        <div class="info-card-head">Macro Environment</div>
        ${macroHTML}
      </div>
    </div>

    <!-- TRADE PLAN -->
    <div class="sec-head"><span class="sec-head-label">Trade Plan</span><div class="sec-head-line"></div></div>
    <div class="plan-card">${planHTML}</div>

    <div class="disclaimer">⚠ AI analysis based on live news — not financial advice. Always confirm with your own chart analysis before trading.</div>
  `;

  const r = document.getElementById('results');
  r.innerHTML = html;
  r.classList.add('show');

  // Animate confidence ring after render
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const arc = document.getElementById('confArc');
      if (arc) arc.style.strokeDashoffset = dashOffset.toFixed(1);
    });
  });
}
</script>
</body>
</html>
